name: ESP32 broker

on:
  push:
    paths:
      - "esp32/broker/**"
      - ".github/workflows/esp32-broker.yml"
  pull_request:
    paths:
      - "esp32/broker/**"
      - ".github/workflows/esp32-broker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esp32/broker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: esp32/broker/go.mod
      - name: Unit tests
        run: go test ./...
      - name: Build linux arm64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -o /tmp/esp32d ./cmd/esp32d
          go build -trimpath -o /tmp/esp32ctl-broker ./cmd/esp32ctl
